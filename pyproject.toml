[project]
name = "discharge-instructions-plain-english"
version = "0.1.0"
description = "Rewrite hospital discharge instructions into plain reading level using a local LLM (education only, not medical advice)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "typer>=0.9,<1.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0,<14.0",
]

[project.scripts]
discharge-plain = "discharge_cli.cli:app"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-mock>=3.10,<4.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["discharge_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"